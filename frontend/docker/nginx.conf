server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Taille max des uploads (documents RH, pieces jointes)
    client_max_body_size 25m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # En-tetes de securite (HSTS est pose par le reverse proxy Caddy)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera : necessaire pour le pointage par reconnaissance faciale / QR ; geolocation : pointage geolocalise
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Healthcheck du conteneur
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Cache des assets statiques (JS, CSS, images)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Modeles face-api (lourds, versionnes avec l'app)
    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html ne doit jamais etre mis en cache (sinon anciens bundles apres deploiement)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA fallback — toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API vers le monolithe LuminaRH (service "backend" du reseau Docker)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Securite
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
