name: CD Deployment Pipeline

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Build and Push Docker Images to GHCR
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./luminaRh
          file: ./luminaRh/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Deploiement distant sur VPS via SSH
  deploy:
    name: Deploy to Server
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Set lower case repository name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DIR: "${{ secrets.DEPLOY_PATH || '$HOME/PointelRH' }}"
          IMAGE_BACKEND: "${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend:latest"
          IMAGE_FRONTEND: "${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend:latest"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: TARGET_DIR,IMAGE_BACKEND,IMAGE_FRONTEND
          script: |
            set -e
            echo "[DEPLOY] Demarrage du deploiement..."
            eval cd "$TARGET_DIR"

            echo "[DEPLOY] Recuperation des dernieres images Docker depuis GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            export BACKEND_IMAGE="$IMAGE_BACKEND"
            export FRONTEND_IMAGE="$IMAGE_FRONTEND"

            docker compose -f docker-compose.prod.yml pull

            echo "[DEPLOY] Execution des migrations Prisma..."
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy || true

            echo "[DEPLOY] Redemarrage des services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[DEPLOY] Nettoyage des anciennes images..."
            docker image prune -af --filter "until=72h"

            echo "[DEPLOY] Smoke test : verification de la sante de l API..."
            for i in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
                echo "[SUCCESS] API saine et operationnelle !"
                exit 0
              fi
              echo "En attente du demarrage du backend ($i/15)..."
              sleep 3
            done

            echo "[ERROR] Le healthcheck de l API a expire."
            docker compose -f docker-compose.prod.yml logs --tail=50 backend
            exit 1
