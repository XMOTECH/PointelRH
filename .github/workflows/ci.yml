name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Backend Validation (NestJS / Prisma) ────────────────
  backend-ci:
    name: Backend (NestJS / Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luminaRh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: luminaRh/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Compile & Build
        run: npm run build

      - name: Unit & Integration Tests
        run: npm test -- --coverage=false

  # ─── 2. Frontend Validation (React / Vite) ──────────────────
  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests (Vitest)
        run: npm test

      - name: Typecheck & Production Build
        run: npm run build

  # ─── 3. Docker Compose & Configuration Syntax Check ─────────
  docker-ci:
    name: Docker Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate local docker-compose.yml
        run: docker compose config -q

      - name: Validate docker-compose.prod.yml
        env:
          POSTGRES_PASSWORD: dummy_ci_password
          REDIS_PASSWORD: dummy_ci_password
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: dummy_ci_password
          KEYCLOAK_CLIENT_SECRET: dummy_ci_secret
        run: docker compose -f docker-compose.prod.yml config -q
